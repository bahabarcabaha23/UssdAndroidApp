plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ussdcompanion.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ussdcompanion.app"
        minSdk 24
        // تم رفعه من 33 إلى 34 ليطابق compileSdk ويكتمل الدعم لأندرويد 14 (أهم أثر عملي: تصبح
        // خدمات foreground service ملزمة بتحديد foregroundServiceType في AndroidManifest.xml،
        // وهذا مطبّق أدناه على HttpServerService). إن كنتم تفضلون البقاء عند 33 مؤقتاً، هذا هو
        // السطر الوحيد الذي يحتاج تراجعاً - باقي تعديلات هذا الإصدار متوافقة مع 33 و34 معاً.
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
